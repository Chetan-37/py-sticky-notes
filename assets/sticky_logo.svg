<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Sticky Notes App Icon</title>
  <desc>Minimal layered sticky notes in warm yellow and coral on a soft cream rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF4C9"/>
      <stop offset="100%" stop-color="#FFD889"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFE45C"/>
      <stop offset="100%" stop-color="#FFC928"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9A62"/>
      <stop offset="100%" stop-color="#F47743"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#8C4B22" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tile)"/>

  <!-- Back note -->
  <g transform="rotate(-5 256 270)" filter="url(#shadow)">
    <rect x="116" y="133" width="286" height="300" rx="22" fill="url(#coral)"/>
  </g>

  <!-- Front sticky note -->
  <g transform="rotate(6 254 250)" filter="url(#shadow)">
    <path d="M145 104
             Q145 88 162 88
             H352 Q370 88 370 106
             V310
             Q370 343 340 366
             L302 395
             Q290 404 273 404
             H162 Q145 404 145 386 Z"
          fill="url(#note)"/>
    <!-- Folded corner -->
    <path d="M302 395 L302 355 Q302 340 317 344 L340 350 Q354 352 370 335
             Q366 354 340 366 Z"
          fill="#F6AE16" opacity=".92"/>
    <path d="M302 355 Q302 340 317 344 L340 350 Q354 352 370 335"
          fill="none" stroke="#FFF09A" stroke-width="3" stroke-linecap="round"/>
    <!-- Writing lines -->
    <path d="M190 174 H292" stroke="#292936" stroke-width="12" stroke-linecap="round"/>
    <path d="M184 224 H320" stroke="#292936" stroke-width="12" stroke-linecap="round"/>
    <path d="M190 274 H270" stroke="#292936" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Small idea accents -->
  <g stroke="#292936" stroke-width="10" stroke-linecap="round">
    <path d="M388 116 L397 96"/>
    <path d="M414 139 L431 124"/>
    <path d="M426 169 L446 164"/>
  </g>
</svg>
